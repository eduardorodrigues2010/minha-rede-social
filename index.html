<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Rede Musical</title>
    <!-- Script Oficial do Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --primary-color: #1DB954; /* Verde estilo Spotify */
            --bg-color: #121212;
            --card-bg: #181818;
            --text-main: #FFFFFF;
            --text-sub: #B3B3B3;
            --border: #282828;
            --input-bg: #2A2A2A;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            color: var(--text-main);
        }

        .hidden { display: none !important; }

        /* Estilos de Autenticação */
        .auth-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background: linear-gradient(to bottom, #1db95433, #121212);
        }

        .auth-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .auth-card h2 { color: var(--primary-color); margin-bottom: 5px; font-size: 32px; }
        .auth-card p { color: var(--text-sub); margin-bottom: 30px; }

        .auth-form input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid var(--border);
            background-color: var(--input-bg);
            color: var(--text-main);
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .btn-main {
            width: 100%;
            background-color: var(--primary-color);
            color: black;
            border: none;
            padding: 14px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }
        .btn-main:hover { transform: scale(1.02); background-color: #1ed760; }

        .google-btn-wrapper { margin: 20px 0; display: flex; justify-content: center; }

        .divider { border-bottom: 1px solid var(--border); margin: 25px 0; position: relative; }
        .divider span { position: absolute; top: -10px; background: var(--card-bg); padding: 0 15px; left: 50%; transform: translateX(-50%); color: var(--text-sub); font-size: 12px; }

        /* Estilos do Feed Musical */
        header {
            background-color: rgba(0,0,0,0.8);
            padding: 15px 30px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .header-content {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo { color: var(--primary-color); font-size: 26px; font-weight: bold; text-decoration: none; display: flex; align-items: center; gap: 10px; }

        .btn-logout { background: transparent; border: 1px solid var(--text-sub); color: var(--text-sub); padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .btn-logout:hover { border-color: white; color: white; }

        main { max-width: 600px; margin: 30px auto; padding: 0 15px; }

        .create-post {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .create-post h3 { margin-top: 0; font-size: 18px; margin-bottom: 15px; }

        textarea {
            width: 100%;
            border: none;
            background-color: var(--input-bg);
            color: var(--text-main);
            border-radius: 8px;
            padding: 15px;
            resize: none;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
            margin-bottom: 10px;
        }

        .post-button {
            background-color: var(--primary-color);
            color: black;
            border: none;
            padding: 10px 25px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            float: right;
        }

        .feed { display: flex; flex-direction: column; gap: 20px; }

        .post {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            transition: 0.3s;
        }
        .post:hover { background-color: #282828; }

        .post-header { display: flex; align-items: center; margin-bottom: 15px; }
        .avatar { width: 45px; height: 45px; background: linear-gradient(45deg, #1db954, #191414); border-radius: 50%; margin-right: 15px; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .username { font-weight: bold; font-size: 16px; }
        .post-time { font-size: 12px; color: var(--text-sub); margin-top: 3px; }
        
        .music-tag {
            display: inline-block;
            background-color: #2e2e2e;
            color: var(--primary-color);
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 13px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .post-content { line-height: 1.6; font-size: 16px; margin-bottom: 15px; }
        
        .post-actions { border-top: 1px solid var(--border); padding-top: 15px; display: flex; gap: 20px; }
        .action-btn { background: none; border: none; color: var(--text-sub); font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 14px; }
        .action-btn:hover { color: white; }
        .liked { color: var(--primary-color) !important; }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="loginPage" class="auth-container">
        <div class="auth-card">
            <h2>🎵 Minha Musical</h2>
            <p>Sua trilha sonora começa aqui.</p>
            
            <div class="google-btn-wrapper">
                <div id="g_id_onload"
                     data-client_id="SUA_CHAVE_AQUI.apps.googleusercontent.com"
                     data-callback="handleCredentialResponse"
                     data-auto_prompt="true">
                </div>
                <div class="g_id_signin" data-type="standard" data-theme="filled_black" data-shape="pill"></div>
            </div>

            <div class="divider"><span>ou entre com e-mail</span></div>

            <div class="auth-form">
                <input type="text" id="loginEmail" placeholder="Usuário musical">
                <input type="password" id="loginPass" placeholder="Sua senha secreta">
                <button class="btn-main" onclick="handleLogin()">Entrar na Roda</button>
            </div>
            
            <div class="divider"></div>
            <p style="font-size: 14px;">Novo por aqui? <a href="#" onclick="showPage('registerPage')" style="color: var(--primary-color); text-decoration: none; font-weight: bold;">Crie sua conta</a></p>
        </div>
    </div>

    <!-- TELA DE CADASTRO -->
    <div id="registerPage" class="auth-container hidden">
        <div class="auth-card">
            <h2>Participe do Show</h2>
            <p>Crie seu perfil e compartilhe seu som.</p>
            <div class="auth-form">
                <input type="text" id="regName" placeholder="Seu nome artístico">
                <input type="text" id="regUser" placeholder="Nome de usuário">
                <input type="password" id="regPass" placeholder="Escolha uma senha forte">
                <button class="btn-main" onclick="handleRegister()">Começar a Tocar</button>
            </div>
            <a href="#" onclick="showPage('loginPage')" style="color: var(--text-sub); text-decoration: none; font-size: 14px; display: block; margin-top: 20px;">Já sou da banda (Login)</a>
        </div>
    </div>

    <!-- TELA DO FEED -->
    <div id="mainPage" class="hidden">
        <header>
            <div class="header-content">
                <a href="#" class="logo"><span>🎵</span> Minha Musical</a>
                <div class="user-info">
                    <span id="displayUserName" style="margin-right: 15px; font-weight: bold; color: var(--primary-color);"></span>
                    <button class="btn-logout" onclick="handleLogout()">Sair</button>
                </div>
            </div>
        </header>

        <main>
            <div class="create-post">
                <h3>O que você está ouvindo agora?</h3>
                <textarea id="postInput" placeholder="Compartilhe uma música, álbum ou artista..." rows="3"></textarea>
                <button class="post-button" onclick="addPost()">Postar Som</button>
                <div style="clear: both;"></div>
            </div>
            <div id="feed" class="feed"></div>
        </main>
    </div>

    <script>
        let currentUser = null;
        let users = JSON.parse(localStorage.getItem('social_users')) || [];
        
        let posts = [
            { id: 1, user: "Eduardo Rodrigues", content: "O novo álbum do Kendrick Lamar está incrível! Qual a opinião de vocês?", tag: "Álbum Novo", time: "15 min atrás", likes: 12, liked: false },
            { id: 2, user: "Manus AI", content: "Acabei de descobrir uma playlist de Jazz fenomenal para trabalhar.", tag: "Playlist", time: "1h atrás", likes: 24, liked: true }
        ];

        function showPage(pageId) {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('registerPage').classList.add('hidden');
            document.getElementById('mainPage').classList.add('hidden');
            document.getElementById(pageId).classList.remove('hidden');
        }

        // --- LÓGICA DO GOOGLE ---
        function handleCredentialResponse(response) {
            const responsePayload = parseJwt(response.credential);
            loginUser({ name: responsePayload.name, username: responsePayload.email });
        }

        function parseJwt (token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        };

        // --- AUTENTICAÇÃO ---
        function handleRegister() {
            const name = document.getElementById('regName').value;
            const user = document.getElementById('regUser').value;
            const pass = document.getElementById('regPass').value;
            if(!name || !user || !pass) return alert("Preencha todos os campos!");
            
            const newUser = { name, username: user, password: pass };
            users.push(newUser);
            localStorage.setItem('social_users', JSON.stringify(users));
            alert("Perfil criado! Bem-vindo ao show.");
            loginUser(newUser);
        }

        function handleLogin() {
            const userVal = document.getElementById('loginEmail').value.trim();
            const passVal = document.getElementById('loginPass').value;
            const user = users.find(u => u.username === userVal && u.password === passVal);
            if(user) loginUser(user);
            else alert("Usuário ou senha não encontrados!");
        }

        function loginUser(user) {
            currentUser = user;
            document.getElementById('displayUserName').innerText = user.name;
            showPage('mainPage');
            renderPosts();
        }

        function handleLogout() {
            currentUser = null;
            showPage('loginPage');
        }

        // --- FEED ---
        function renderPosts() {
            const feed = document.getElementById('feed');
            feed.innerHTML = '';
            posts.forEach(post => {
                const postElement = document.createElement('div');
                postElement.className = 'post';
                postElement.innerHTML = `
                    <div class="post-header">
                        <div class="avatar">${post.user[0]}</div>
                        <div>
                            <div class="username">${post.user}</div>
                            <div class="post-time">${post.time}</div>
                        </div>
                    </div>
                    ${post.tag ? `<span class="music-tag"># ${post.tag}</span>` : ''}
                    <div class="post-content">${post.content}</div>
                    <div class="post-actions">
                        <button class="action-btn ${post.liked ? 'liked' : ''}" onclick="toggleLike(${post.id})">
                            ❤️ ${post.likes} Curtidas
                        </button>
                        <button class="action-btn">💬 Comentar</button>
                    </div>
                `;
                feed.appendChild(postElement);
            });
        }

        function addPost() {
            const input = document.getElementById('postInput');
            if (!input.value.trim()) return;
            posts.unshift({ 
                id: Date.now(), 
                user: currentUser.name, 
                content: input.value, 
                tag: "Minha Escolha",
                time: "Agora mesmo", 
                likes: 0, 
                liked: false 
            });
            input.value = '';
            renderPosts();
        }

        function toggleLike(id) {
            const post = posts.find(p => p.id === id);
            if(post) { post.liked ? post.likes-- : post.likes++; post.liked = !post.liked; renderPosts(); }
        }
    </script>
</body>
</html>
