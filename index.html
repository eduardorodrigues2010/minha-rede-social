<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musica Play | Global</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --primary: #1DB954;
            --bg: #000000;
            --surface: #121212;
            --text-base: #FFFFFF;
            --text-sub: #B3B3B3;
            --border: #333333;
        }

        * { box-sizing: border-box; transition: 0.3s; }

        body {
            font-family: 'Circular', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            margin: 0;
            color: var(--text-base);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .hidden { display: none !important; }

        /* --- AUTH PAGES --- */
        .auth-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: radial-gradient(circle at center, #1db95422, transparent);
        }

        .auth-card {
            background-color: var(--surface);
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .auth-card h1 { font-size: 36px; font-weight: 900; color: var(--primary); margin: 0 0 10px 0; letter-spacing: -1px; }
        .auth-card p { color: var(--text-sub); font-size: 14px; margin-bottom: 30px; }

        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group input {
            width: 100%;
            padding: 12px;
            background: #282828;
            border: 1px solid transparent;
            border-radius: 8px;
            color: white;
            font-size: 16px;
        }
        .input-group input:focus { border-color: var(--primary); outline: none; }

        .btn-primary {
            width: 100%;
            background-color: var(--primary);
            color: black;
            border: none;
            padding: 14px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        /* --- MINIMAL MAIN APP --- */
        header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: absolute;
            top: 0;
            width: 100%;
            z-index: 10;
        }

        .logo-small { font-size: 20px; font-weight: 900; color: var(--primary); text-decoration: none; }

        .user-profile-nav {
            display: flex;
            align-items: center;
            gap: 15px;
            background: var(--surface);
            padding: 5px 15px;
            border-radius: 30px;
            border: 1px solid var(--border);
        }
        .avatar-small { width: 30px; height: 30px; background: var(--primary); border-radius: 50%; color: black; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; }
        .logout-link { color: var(--text-sub); font-size: 12px; cursor: pointer; text-decoration: none; }

        .main-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .welcome-text { font-size: 48px; font-weight: 900; margin-bottom: 40px; letter-spacing: -2px; }

        .search-box {
            width: 100%;
            max-width: 600px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            background: white;
            border: none;
            border-radius: 50px;
            padding: 20px 30px 20px 60px;
            color: black;
            font-size: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .search-box .icon { position: absolute; left: 25px; top: 22px; color: #666; font-size: 20px; }

        .search-results-overlay {
            position: absolute;
            top: 75px;
            width: 100%;
            background: var(--surface);
            border-radius: 12px;
            border: 1px solid var(--border);
            max-height: 400px;
            overflow-y: auto;
            text-align: left;
            z-index: 100;
        }

        .result-item { padding: 15px 25px; display: flex; align-items: center; gap: 15px; cursor: pointer; border-bottom: 1px solid var(--border); }
        .result-item:hover { background: #282828; }
        .result-icon { font-size: 24px; width: 40px; height: 40px; background: #333; border-radius: 4px; display: flex; align-items: center; justify-content: center; }

        /* --- PLAYER FIXO --- */
        .mini-player {
            position: fixed;
            bottom: 30px;
            background: var(--surface);
            padding: 15px 30px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            max-width: 90%;
            z-index: 200;
        }

        .player-info { display: flex; align-items: center; gap: 12px; }
        .player-title { font-size: 14px; font-weight: bold; }
        .player-artist { font-size: 12px; color: var(--text-sub); }
        .btn-play { background: white; color: black; width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; }

    </style>
</head>
<body>

    <!-- LOGIN -->
    <div id="loginPage" class="auth-wrapper">
        <div class="auth-card">
            <h1>MUSICA PLAY</h1>
            <p>Sua busca musical global</p>
            <div class="input-group">
                <input type="text" id="loginUser" placeholder="Usuário" onkeypress="if(event.key === 'Enter') handleLogin()">
            </div>
            <div class="input-group">
                <input type="password" id="loginPass" placeholder="Senha" onkeypress="if(event.key === 'Enter') handleLogin()">
            </div>
            <button class="btn-primary" onclick="handleLogin()">Entrar</button>
            <p style="margin-top: 20px;">Não tem conta? <a href="#" onclick="showPage('registerPage')" style="color: var(--primary);">Cadastre-se</a></p>
        </div>
    </div>

    <!-- CADASTRO -->
    <div id="registerPage" class="auth-wrapper hidden">
        <div class="auth-card">
            <h1>CRIAR CONTA</h1>
            <p>Acesse milhões de artistas</p>
            <div class="input-group">
                <input type="text" id="regName" placeholder="Nome Completo" onkeypress="if(event.key === 'Enter') handleRegister()">
            </div>
            <div class="input-group">
                <input type="text" id="regUser" placeholder="Usuário" onkeypress="if(event.key === 'Enter') handleRegister()">
            </div>
            <div class="input-group">
                <input type="password" id="regPass" placeholder="Senha" onkeypress="if(event.key === 'Enter') handleRegister()">
            </div>
            <button class="btn-primary" onclick="handleRegister()">Cadastrar</button>
            <p style="margin-top: 20px;"><a href="#" onclick="showPage('loginPage')" style="color: var(--text-sub);">Voltar ao login</a></p>
        </div>
    </div>

    <!-- APP PRINCIPAL -->
    <div id="mainApp" class="hidden">
        <header>
            <a href="#" class="logo-small">MUSICA PLAY</a>
            <div class="user-profile-nav">
                <div id="userAvatar" class="avatar-small">U</div>
                <span id="userName" style="font-weight: bold; font-size: 14px;">Usuário</span>
                <span class="logout-link" onclick="location.reload()">Sair</span>
            </div>
        </header>

        <div class="main-container">
            <h2 class="welcome-text">Busca Global</h2>
            <div class="search-box">
                <span class="icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Pesquise qualquer artista do mundo..." onkeyup="handleSearch(event)">
                <div id="searchOverlay" class="search-results-overlay hidden"></div>
            </div>
        </div>

        <!-- PLAYER -->
        <div id="player" class="mini-player hidden">
            <div class="player-info">
                <div id="pIcon" style="font-size: 24px;">🎵</div>
                <div>
                    <div id="pTitle" class="player-title">Música</div>
                    <div id="pArtist" class="player-artist">Artista</div>
                </div>
            </div>
            <div class="btn-play" id="pPlay" onclick="togglePlay()">▶️</div>
        </div>
    </div>

    <script>
        let users = JSON.parse(localStorage.getItem('mp_global_users')) || [];
        let isPlaying = false;

        // BANCO DE DADOS EXPANDIDO (TOP ARTISTAS DO MUNDO)
        const musicDB = [
            // BRASIL
            { name: "Ana Castela", genre: "Sertanejo", hit: "Solteiro Forçado", icon: "🤠" },
            { name: "Gusttavo Lima", genre: "Sertanejo", hit: "Canudinho", icon: "🏛️" },
            { name: "Anitta", genre: "Pop", hit: "Bellakeo", icon: "🇧🇷" },
            { name: "Matuê", genre: "Trap", hit: "Conexões de Máfia", icon: "🌵" },
            { name: "Marília Mendonça", genre: "Sertanejo", hit: "Leão", icon: "👑" },
            { name: "MC Ryan SP", genre: "Funk", hit: "Dentro da Hilux", icon: "🦈" },
            { name: "Luísa Sonza", genre: "Pop", hit: "Chico", icon: "🔥" },
            { name: "Thiaguinho", genre: "Pagode", hit: "Falta Você", icon: "🥁" },
            { name: "Luan Santana", genre: "Sertanejo", hit: "Deja Vu", icon: "✨" },
            { name: "Ludmilla", genre: "Pagode", hit: "Maliciosa", icon: "🎤" },

            // INTERNACIONAL (USA/EUROPE)
            { name: "Taylor Swift", genre: "Pop", hit: "Cruel Summer", icon: "🧣" },
            { name: "The Weeknd", genre: "R&B/Pop", hit: "Blinding Lights", icon: "🌅" },
            { name: "Drake", genre: "Rap", hit: "God's Plan", icon: "🦉" },
            { name: "Billie Eilish", genre: "Alt Pop", hit: "What Was I Made For?", icon: "🥑" },
            { name: "Travis Scott", genre: "Hip-Hop", hit: "FE!N", icon: "🌵" },
            { name: "Dua Lipa", genre: "Pop", hit: "Houdini", icon: "🦋" },
            { name: "Ed Sheeran", genre: "Pop", hit: "Shape of You", icon: "➕" },
            { name: "Beyoncé", genre: "R&B", hit: "TEXAS HOLD 'EM", icon: "🐝" },
            { name: "Post Malone", genre: "Pop/Rap", hit: "Sunflower", icon: "🌻" },
            { name: "Bruno Mars", genre: "Pop/Funk", hit: "Uptown Funk", icon: "🎩" },
            { name: "Rihanna", genre: "Pop/R&B", hit: "Diamonds", icon: "💎" },
            { name: "Justin Bieber", genre: "Pop", hit: "Peaches", icon: "🍑" },
            { name: "Katy Perry", genre: "Pop", hit: "Roar", icon: "🦁" },
            { name: "Lady Gaga", genre: "Pop", hit: "Bad Romance", icon: "🎭" },
            { name: "Ariana Grande", genre: "Pop", hit: "yes, and?", icon: "☁️" },

            // LATIN (REGGAETON/TRAP)
            { name: "Bad Bunny", genre: "Reggaeton", hit: "Monaco", icon: "🐰" },
            { name: "Karol G", genre: "Reggaeton", hit: "PROVENZA", icon: "🌸" },
            { name: "J Balvin", genre: "Reggaeton", hit: "Mi Gente", icon: "⚡" },
            { name: "Shakira", genre: "Latin Pop", hit: "Bzrp Music Sessions #53", icon: "🐺" },
            { name: "Peso Pluma", genre: "Regional Mexican", hit: "Ella Baila Sola", icon: "🕷️" },

            // K-POP
            { name: "BTS", genre: "K-Pop", hit: "Dynamite", icon: "💜" },
            { name: "BLACKPINK", genre: "K-Pop", hit: "How You Like That", icon: "💗" },
            { name: "NewJeans", genre: "K-Pop", hit: "Super Shy", icon: "🐰" },
            { name: "Stray Kids", genre: "K-Pop", hit: "LALALALA", icon: "🌟" },

            // ROCK/CLASSICS
            { name: "Queen", genre: "Rock", hit: "Bohemian Rhapsody", icon: "👑" },
            { name: "Coldplay", genre: "Alt Rock", hit: "Yellow", icon: "🌙" },
            { name: "Imagine Dragons", genre: "Rock", hit: "Believer", icon: "🐉" },
            { name: "Arctic Monkeys", genre: "Indie Rock", hit: "Do I Wanna Know?", icon: "❄️" }
        ];

        function showPage(pageId) {
            document.querySelectorAll('.auth-wrapper, #mainApp').forEach(el => el.classList.add('hidden'));
            document.getElementById(pageId).classList.remove('hidden');
        }

        function handleRegister() {
            const name = document.getElementById('regName').value;
            const user = document.getElementById('regUser').value;
            const pass = document.getElementById('regPass').value;
            if(!name || !user || !pass) return alert("Preencha tudo!");
            const newUser = { name, user, pass };
            users.push(newUser);
            localStorage.setItem('mp_global_users', JSON.stringify(users));
            login(newUser);
        }

        function handleLogin() {
            const userVal = document.getElementById('loginUser').value;
            const passVal = document.getElementById('loginPass').value;
            const found = users.find(u => u.user === userVal && u.pass === passVal);
            if(found) login(found);
            else alert("Erro!");
        }

        function login(user) {
            showPage('mainApp');
            document.getElementById('userName').innerText = user.name;
            document.getElementById('userAvatar').innerText = user.name[0].toUpperCase();
        }

        function handleSearch(e) {
            const query = e.target.value.toLowerCase();
            const overlay = document.getElementById('searchOverlay');
            if(query.length < 2) { overlay.classList.add('hidden'); return; }

            const filtered = musicDB.filter(m => m.name.toLowerCase().includes(query) || m.genre.toLowerCase().includes(query));
            overlay.innerHTML = '';
            if(filtered.length > 0) {
                filtered.forEach(m => {
                    const div = document.createElement('div');
                    div.className = 'result-item';
                    div.onclick = () => play(m);
                    div.innerHTML = `<div class="result-icon">${m.icon}</div><div><div style="font-weight:bold">${m.name}</div><div style="font-size:12px;color:var(--text-sub)">${m.hit} • ${m.genre}</div></div>`;
                    overlay.appendChild(div);
                });
                overlay.classList.remove('hidden');
            } else {
                overlay.innerHTML = '<div class="result-item">Nenhum artista global encontrado</div>';
                overlay.classList.remove('hidden');
            }
        }

        function play(m) {
            document.getElementById('pTitle').innerText = m.hit;
            document.getElementById('pArtist').innerText = m.name;
            document.getElementById('pIcon').innerText = m.icon;
            document.getElementById('player').classList.remove('hidden');
            document.getElementById('pPlay').innerText = "⏸️";
            isPlaying = true;
            document.getElementById('searchOverlay').classList.add('hidden');
            document.getElementById('searchInput').value = '';
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            document.getElementById('pPlay').innerText = isPlaying ? "⏸️" : "▶️";
        }
    </script>
</body>
</html>
