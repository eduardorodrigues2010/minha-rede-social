<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musica Play</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --primary-color: #1DB954;
            --bg-color: #121212;
            --card-bg: #181818;
            --text-main: #FFFFFF;
            --text-sub: #B3B3B3;
            --border: #282828;
            --input-bg: #2A2A2A;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            color: var(--text-main);
            padding-bottom: 100px;
        }

        .hidden { display: none !important; }

        /* Estilos de Autenticação */
        .auth-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background: linear-gradient(to bottom, #1db95433, #121212);
        }

        .auth-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .auth-card h2 { 
            color: var(--primary-color); 
            margin-bottom: 10px; 
            font-size: 48px; 
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -2px;
            text-shadow: 0 0 10px rgba(29, 185, 84, 0.5);
            font-family: 'Arial Black', sans-serif;
        }
        .auth-card p { color: var(--text-sub); margin-bottom: 30px; }

        .auth-form input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid var(--border);
            background-color: var(--input-bg);
            color: var(--text-main);
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .btn-main {
            width: 100%;
            background-color: var(--primary-color);
            color: black;
            border: none;
            padding: 14px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .divider { border-bottom: 1px solid var(--border); margin: 25px 0; position: relative; }
        .divider span { position: absolute; top: -10px; background: var(--card-bg); padding: 0 15px; left: 50%; transform: translateX(-50%); color: var(--text-sub); font-size: 12px; }

        /* Estilos do Feed e Pesquisa */
        header {
            background-color: rgba(0,0,0,0.9);
            padding: 10px 30px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .logo { 
            color: var(--primary-color); 
            font-size: 24px; 
            font-weight: 900; 
            text-decoration: none; 
            min-width: 180px;
            font-family: 'Arial Black', sans-serif;
        }

        .search-bar {
            flex-grow: 1;
            max-width: 500px;
            position: relative;
        }

        .search-bar input {
            width: 100%;
            background-color: #242424;
            border: 1px solid transparent;
            border-radius: 20px;
            padding: 10px 20px 10px 45px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .search-bar input:focus { border-color: var(--text-sub); background-color: #2a2a2a; }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-sub);
        }

        .btn-logout { background: transparent; border: 1px solid var(--text-sub); color: var(--text-sub); padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 13px; }

        main { max-width: 600px; margin: 30px auto; padding: 0 15px; }

        /* Resultados da Pesquisa */
        .search-results {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid var(--primary-color);
        }

        .result-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
        }

        .result-item:hover { background-color: #282828; }

        .result-img { width: 50px; height: 50px; border-radius: 4px; background-color: #333; margin-right: 15px; display: flex; align-items: center; justify-content: center; font-size: 20px; }

        .result-info h4 { margin: 0; font-size: 15px; }
        .result-info p { margin: 3px 0 0; font-size: 13px; color: var(--text-sub); }

        /* Feed */
        .create-post { background-color: var(--card-bg); padding: 20px; border-radius: 8px; margin-bottom: 30px; }
        textarea { width: 100%; border: none; background-color: var(--input-bg); color: var(--text-main); border-radius: 8px; padding: 15px; resize: none; font-size: 15px; outline: none; box-sizing: border-box; }
        .post-button { background-color: var(--primary-color); color: black; border: none; padding: 10px 25px; border-radius: 25px; font-weight: bold; cursor: pointer; float: right; margin-top: 10px; }

        .post { background-color: var(--card-bg); padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .post-header { display: flex; align-items: center; margin-bottom: 12px; }
        .avatar { width: 40px; height: 40px; background: var(--primary-color); border-radius: 50%; margin-right: 12px; display: flex; align-items: center; justify-content: center; color: black; font-weight: bold; }
        .username { font-weight: bold; }
        .post-content { line-height: 1.5; margin-bottom: 15px; }
        .post-actions { border-top: 1px solid var(--border); padding-top: 10px; display: flex; gap: 20px; color: var(--text-sub); font-size: 14px; }

        /* PLAYER DE MÚSICA */
        .music-player {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #181818;
            border-top: 1px solid var(--border);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 1000;
            box-sizing: border-box;
        }

        .player-info { display: flex; align-items: center; width: 30%; }
        .player-img { width: 56px; height: 56px; border-radius: 4px; background-color: #333; margin-right: 15px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .player-text h4 { margin: 0; font-size: 14px; color: white; }
        .player-text p { margin: 3px 0 0; font-size: 12px; color: var(--text-sub); }

        .player-controls { width: 40%; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .control-btns { display: flex; align-items: center; gap: 20px; font-size: 20px; }
        .play-btn { background: white; color: black; width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; }
        
        .progress-bar { width: 100%; height: 4px; background-color: #4f4f4f; border-radius: 2px; position: relative; }
        .progress-fill { width: 35%; height: 100%; background-color: var(--primary-color); border-radius: 2px; }

        .player-volume { width: 30%; display: flex; justify-content: flex-end; align-items: center; gap: 10px; color: var(--text-sub); }
    </style>
</head>
<body>

    <!-- LOGIN/CADASTRO -->
    <div id="loginPage" class="auth-container">
        <div class="auth-card">
            <h2>MUSICA PLAY</h2>
            <p style="letter-spacing: 2px; font-weight: bold; color: var(--primary-color);">DÊ UM PLAY NA SUA VIDA</p>
            <div class="auth-form">
                <input type="text" id="loginEmail" placeholder="Usuário">
                <input type="password" id="loginPass" placeholder="Senha">
                <button class="btn-main" onclick="handleLogin()">Entrar</button>
            </div>
            <div class="divider"><span>ou</span></div>
            <button class="btn-main" style="background: transparent; border: 1px solid var(--text-sub); color: white;" onclick="showPage('registerPage')">Criar Conta</button>
        </div>
    </div>

    <div id="registerPage" class="auth-container hidden">
        <div class="auth-card">
            <h2>Criar Perfil</h2>
            <div class="auth-form">
                <input type="text" id="regName" placeholder="Nome completo">
                <input type="text" id="regUser" placeholder="Nome de usuário">
                <input type="password" id="regPass" placeholder="Senha">
                <button class="btn-main" onclick="handleRegister()">Cadastrar e Entrar</button>
            </div>
            <p style="margin-top: 20px; font-size: 14px;"><a href="#" onclick="showPage('loginPage')" style="color: var(--text-sub);">Voltar ao login</a></p>
        </div>
    </div>

    <!-- FEED E PESQUISA -->
    <div id="mainPage" class="hidden">
        <header>
            <div class="header-content">
                <a href="#" class="logo">MUSICA PLAY</a>
                <div class="search-bar">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" placeholder="Pesquisar artistas brasileiros..." onkeyup="handleSearch(event)">
                </div>
                <div class="user-info">
                    <button class="btn-logout" onclick="handleLogout()">Sair</button>
                </div>
            </div>
        </header>

        <main>
            <div id="searchResults" class="search-results hidden">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h3 style="margin: 0;">Resultados</h3>
                    <button onclick="closeSearch()" style="background: none; border: none; color: var(--text-sub); cursor: pointer;">Fechar X</button>
                </div>
                <div id="resultsList"></div>
            </div>

            <div class="create-post">
                <textarea id="postInput" placeholder="O que você está ouvindo?" rows="2"></textarea>
                <button class="post-button" onclick="addPost()">Postar</button>
                <div style="clear: both;"></div>
            </div>
            <div id="feed" class="feed"></div>
        </main>

        <!-- PLAYER DE MÚSICA FIXO -->
        <div class="music-player">
            <div class="player-info">
                <div class="player-img" id="playerImg">🎵</div>
                <div class="player-text">
                    <h4 id="playerTitle">Selecione uma música</h4>
                    <p id="playerSub">Musica Play</p>
                </div>
            </div>
            <div class="player-controls">
                <div class="control-btns">
                    <span>⏮️</span>
                    <div class="play-btn" id="playBtn" onclick="togglePlay()">▶️</div>
                    <span>⏭️</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>
            </div>
            <div class="player-volume">
                <span>🔊</span>
                <div style="width: 80px; height: 4px; background: #4f4f4f; border-radius: 2px;">
                    <div style="width: 70%; height: 100%; background: white; border-radius: 2px;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let users = JSON.parse(localStorage.getItem('social_users')) || [];
        let isPlaying = false;
        
        const musicData = [
            { name: "Ana Castela", type: "Sertanejo", info: "A Boiadeira", icon: "🤠" },
            { name: "Gusttavo Lima", type: "Sertanejo", info: "O Embaixador", icon: "🏛️" },
            { name: "Jorge & Mateus", type: "Sertanejo", info: "Os Reis do Sertanejo", icon: "🎸" },
            { name: "Marília Mendonça", type: "Sertanejo", info: "Rainha da Sofrência", icon: "👑" },
            { name: "Luan Santana", type: "Sertanejo", info: "Luan City", icon: "✨" },
            { name: "MC Ryan SP", type: "Funk", info: "O Tubarão", icon: "🦈" },
            { name: "MC Daniel", type: "Funk", info: "O Falcão", icon: "🦅" },
            { name: "Ludmilla", type: "Funk/Pop", info: "Numanice", icon: "🎤" },
            { name: "Anitta", type: "Pop/Funk", info: "Girl From Rio", icon: "🇧🇷" },
            { name: "Thiaguinho", type: "Pagode", info: "Tardezinha", icon: "🥁" },
            { name: "Matuê", type: "Trap", info: "30PRAUM", icon: "🌵" }
        ];

        let posts = [
            { id: 1, user: "Eduardo Rodrigues", content: "Ouvindo o novo álbum da Billie Eilish. Incrível!", time: "10 min atrás", likes: 5, liked: false },
            { id: 2, user: "Manus AI", content: "A playlist 'Chill Vibes' é perfeita para codar.", time: "1h atrás", likes: 10, liked: true }
        ];

        function showPage(pageId) {
            document.querySelectorAll('.auth-container, #mainPage').forEach(el => el.classList.add('hidden'));
            document.getElementById(pageId).classList.remove('hidden');
        }

        function handleSearch(event) {
            const query = event.target.value.toLowerCase();
            const resultsArea = document.getElementById('searchResults');
            const resultsList = document.getElementById('resultsList');
            if (query.length < 2) { resultsArea.classList.add('hidden'); return; }
            const filtered = musicData.filter(item => item.name.toLowerCase().includes(query));
            resultsList.innerHTML = '';
            if (filtered.length > 0) {
                filtered.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'result-item';
                    div.onclick = () => playMusic(item);
                    div.innerHTML = `<div class="result-img">${item.icon}</div><div class="result-info"><h4>${item.name}</h4><p>${item.type} • ${item.info}</p></div>`;
                    resultsList.appendChild(div);
                });
                resultsArea.classList.remove('hidden');
            }
        }

        function playMusic(item) {
            document.getElementById('playerTitle').innerText = item.name;
            document.getElementById('playerSub').innerText = item.type + " • Tocando agora";
            document.getElementById('playerImg').innerText = item.icon;
            document.getElementById('playBtn').innerText = "⏸️";
            isPlaying = true;
            closeSearch();
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            document.getElementById('playBtn').innerText = isPlaying ? "⏸️" : "▶️";
        }

        function closeSearch() { document.getElementById('searchResults').classList.add('hidden'); document.getElementById('searchInput').value = ''; }

        function handleRegister() {
            const name = document.getElementById('regName').value;
            const user = document.getElementById('regUser').value;
            const pass = document.getElementById('regPass').value;
            if(!name || !user || !pass) return alert("Preencha tudo!");
            const newUser = { name, username: user, password: pass };
            users.push(newUser);
            localStorage.setItem('social_users', JSON.stringify(users));
            loginUser(newUser);
        }

        function handleLogin() {
            const userVal = document.getElementById('loginEmail').value;
            const passVal = document.getElementById('loginPass').value;
            const user = users.find(u => u.username === userVal && u.password === passVal);
            if(user) loginUser(user);
            else alert("Erro!");
        }

        function loginUser(user) { currentUser = user; showPage('mainPage'); renderPosts(); }
        function handleLogout() { currentUser = null; showPage('loginPage'); }

        function renderPosts() {
            const feed = document.getElementById('feed');
            feed.innerHTML = '';
            posts.forEach(post => {
                const div = document.createElement('div');
                div.className = 'post';
                div.innerHTML = `
                    <div class="post-header"><div class="avatar">${post.user[0]}</div><div><div class="username">${post.user}</div><div class="post-time">${post.time}</div></div></div>
                    <div class="post-content">${post.content}</div>
                    <div class="post-actions"><span style="cursor:pointer" onclick="toggleLike(${post.id})">${post.liked ? '❤️' : '🤍'} ${post.likes} Curtidas</span></div>
                `;
                feed.appendChild(div);
            });
        }

        function addPost() {
            const input = document.getElementById('postInput');
            if (!input.value.trim()) return;
            posts.unshift({ id: Date.now(), user: currentUser.name, content: input.value, time: "Agora mesmo", likes: 0, liked: false });
            input.value = '';
            renderPosts();
        }

        function toggleLike(id) {
            const post = posts.find(p => p.id === id);
            if(post) { post.liked ? post.likes-- : post.likes++; post.liked = !post.liked; renderPosts(); }
        }
    </script>
</body>
</html>
